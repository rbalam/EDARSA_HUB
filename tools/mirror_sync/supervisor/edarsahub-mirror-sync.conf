[program:edarsahub-mirror-sync]
command=/bin/bash /app/tools/mirror_sync/mirror_sync_supervisor_entrypoint.sh
directory=/app
autostart=false
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/edarsahub-mirror-sync.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=MIRROR_SYNC_LOOP_SECONDS="10",MIRROR_LAUNCHER_LOOP_SECONDS="15"
