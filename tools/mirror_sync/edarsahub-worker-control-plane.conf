[program:edarsahub-worker-control-plane]
command=/root/.venv/bin/python -m tools.mirror_sync.worker_control_plane
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/edarsahub-worker-control-plane.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=EDARSAHUB_CONTROL_PLANE_INTERVAL="15"
