[program:edarsahub-universal-worker]
command=/bin/bash /app/tools/mirror_sync/universal_job_worker.sh
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/edarsahub-universal-worker.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=UNIVERSAL_WORKER_INTAKE_SECONDS="5",UNIVERSAL_WORKER_RESULT_SECONDS="5",UNIVERSAL_WORKER_HEALTH_SECONDS="30",UNIVERSAL_WORKER_RECONCILE_SECONDS="30",UNIVERSAL_WORKER_DISPATCH_IDLE_SECONDS="2"
