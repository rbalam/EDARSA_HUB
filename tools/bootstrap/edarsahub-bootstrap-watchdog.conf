[program:edarsahub-bootstrap-watchdog]
command=/usr/bin/python3 /app/tools/bootstrap/edarsahub_bootstrap_watchdog.py
directory=/
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/edarsahub-bootstrap-watchdog.log
stderr_logfile=/var/log/edarsahub-bootstrap-watchdog.err.log
environment=EDARSAHUB_APP="/app",EDARSAHUB_BOOTSTRAP_STATE="/var/lib/edarsahub-bootstrap",EDARSAHUB_DEV_BRANCH="Edarsahub_Desarrollo",EDARSAHUB_BOOTSTRAP_INTERVAL="20",EDARSAHUB_BOOTSTRAP_MAX_STALE="60"
