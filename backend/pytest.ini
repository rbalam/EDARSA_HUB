[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick validation tests (no mocks, real API)
    regression: Full regression tests
    slow: Slow running tests (may timeout)
    unit: Unit tests with mocks (no real API/DB)
    integration: Integration tests (real API)
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
