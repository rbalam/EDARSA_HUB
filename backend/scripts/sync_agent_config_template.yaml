# ============================================================================
# EDARSA Sync Agent - Configuración Piloto
# ============================================================================
#
# Este archivo debe completarse con los datos del servidor piloto.
# NUNCA commitear este archivo con credenciales reales a repositorios públicos.
#
# USO:
#   1. Copiar este archivo como config.yaml
#   2. Completar los valores con datos reales
#   3. Ejecutar: python sync_agent_piloto.py --config config.yaml
#
# ============================================================================

# Identificador único del agente
# Formato recomendado: agent-{nombre_servidor}-{numero}
agent_id: "agent-piloto-sr-001"

# URL de EDARSA HUB (sin trailing slash)
# Ejemplo producción: https://edarsa-hub.example.com
# Ejemplo preview: https://erp-crm-enterprise-1.preview.emergentagent.com
hub_url: "https://TU_HUB_URL_AQUI"

# Token JWT generado desde HUB
# Obtener via: POST /api/admin/agents/generate-token
# IMPORTANTE: Este token es específico para este agente y servidor
hub_token: "PEGAR_TOKEN_AQUI"

# ID del servidor en EDARSA HUB (UUID)
# Obtener desde menú Servidores en HUB
server_id: "PEGAR_SERVER_ID_AQUI"

# Configuración de SQL Server local
sql_local:
  # Host del SQL Server (puede ser localhost si el agente corre en la misma máquina)
  host: "localhost"
  # Puerto SQL Server (default 1433)
  port: 1433
  # Nombre de la base de datos SoftRestaurant
  database: "NOMBRE_BASE_DE_DATOS"
  # Usuario SQL (preferiblemente de solo lectura)
  username: "usuario_sql"
  # Contraseña SQL
  password: "password_sql"

# ============================================================================
# NOTAS DE SEGURIDAD
# ============================================================================
#
# 1. El token JWT expira en 1 año. Rotarlo antes si hay sospecha de compromiso.
#
# 2. El usuario SQL debe tener permisos mínimos:
#    - SELECT sobre tablas: cheques, turnos
#    - NO necesita INSERT, UPDATE, DELETE
#
# 3. Este archivo contiene credenciales sensibles:
#    - NO subir a repositorios públicos
#    - Proteger con permisos de archivo (chmod 600)
#    - Considerar encriptación para producción
#
# ============================================================================
# EJEMPLO DE EJECUCIÓN
# ============================================================================
#
# # Verificar solo autenticación:
# python sync_agent_piloto.py --config config.yaml --test-only
#
# # Sincronizar datos del día actual:
# python sync_agent_piloto.py --config config.yaml
#
# # Sincronizar datos de una fecha específica:
# python sync_agent_piloto.py --config config.yaml --fecha 2026-04-22
#
# ============================================================================
