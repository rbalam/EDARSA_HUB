name: Preview Commercial External Owner

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Synchronizer to trigger"
        required: true
        default: "open_sales"
        type: choice
        options:
          - open_sales
          - closed_sales

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-commercial-external-owner-${{ github.event.schedule || inputs.target || 'manual' }}
  cancel-in-progress: false

env:
  OIDC_AUDIENCE: edarsahub-preview-commercial-scheduler
  RUNTIME_PROFILE: ops/runtime/profiles/development.json

jobs:
  open-sales:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch' && inputs.target == 'open_sales'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve canonical Preview URL
        id: runtime
        run: |
          set -euo pipefail
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("ops/runtime/profiles/development.json").read_text())
          print(str(profile["base_url"]).rstrip("/"))
          PY
          )"
          test -n "$BASE_URL"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub OIDC token
        id: oidc
        env:
          AUDIENCE: ${{ env.OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body             --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Canary Ventas del Dia
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          URL="${BASE_URL%/}/api/internal/preview-scheduler-trigger/sync-comercial-abiertas-v2"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}'             --connect-timeout 30 --max-time 540             --request POST             --header "Authorization: Bearer $OIDC_TOKEN"             "$URL")"
          cat /tmp/response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

  closed-sales:
    if: github.event_name == 'schedule' && github.event.schedule == '2,17,32,47 * * * *' || github.event_name == 'workflow_dispatch' && inputs.target == 'closed_sales'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve canonical Preview URL
        id: runtime
        run: |
          set -euo pipefail
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("ops/runtime/profiles/development.json").read_text())
          print(str(profile["base_url"]).rstrip("/"))
          PY
          )"
          test -n "$BASE_URL"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub OIDC token
        id: oidc
        env:
          AUDIENCE: ${{ env.OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body             --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Canary Ventas Cerradas
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          URL="${BASE_URL%/}/api/internal/preview-scheduler-trigger/sync-comercial-v2"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}'             --connect-timeout 30 --max-time 840             --request POST             --header "Authorization: Bearer $OIDC_TOKEN"             "$URL")"
          cat /tmp/response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
