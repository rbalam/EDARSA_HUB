name: Commercial GitHub External Owner

on:
  schedule:
    - cron: "2-59/5 * * * *"
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Synchronizer to trigger"
        required: true
        default: "open_sales"
        type: choice
        options:
          - open_sales
          - closed_sales
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/preview-commercial-external-owner.yml"

permissions:
  contents: read

concurrency:
  group: commercial-github-external-owner-${{ github.event.schedule || inputs.target || github.event_name }}
  cancel-in-progress: false

env:
  EDARSA_ENV: DEVELOPMENT
  SCHEDULER_SYNC_COMERCIAL_ABIERTAS_V2_ENABLED: "true"
  SCHEDULER_SYNC_COMERCIAL_V2_ENABLED: "true"
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
  SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}

jobs:
  open-sales:
    if: github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '2-59/5 * * * *' || github.event_name == 'workflow_dispatch' && inputs.target == 'open_sales'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-commercial-owner.txt
          python -m pip install -r /tmp/requirements-commercial-owner.txt

      - name: Validate external owner secrets
        run: |
          set -euo pipefail
          test -n "$EDARSAHUB_SQL_PASSWORD"
          test -n "$SERVER_SECRET_KEY"

      - name: Run canonical Ventas del Dia
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/run_commercial_github_owner.py open_sales --require-executed

  closed-sales:
    if: github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '4,19,34,49 * * * *' || github.event_name == 'workflow_dispatch' && inputs.target == 'closed_sales'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-commercial-owner.txt
          python -m pip install -r /tmp/requirements-commercial-owner.txt

      - name: Validate external owner secrets
        run: |
          set -euo pipefail
          test -n "$EDARSAHUB_SQL_PASSWORD"
          test -n "$SERVER_SECRET_KEY"

      - name: Run canonical Ventas Cerradas
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/run_commercial_github_owner.py closed_sales

