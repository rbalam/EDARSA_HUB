name: Current Operation Cut-Aware Canary

on:
  push:
    branches:
      - fix/current-operation-cut-aware-20261013
    paths:
      - ".github/workflows/current-operation-cut-aware-canary.yml"
      - "backend/modules/comercial_analytics/repository_operational.py"
      - "backend/tests/test_comercial_operacion_en_curso_repository.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  EDARSA_ENV: DEVELOPMENT
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
  SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}

jobs:
  cut-aware-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-cut-aware.txt
          python -m pip install -r /tmp/requirements-cut-aware.txt

      - name: Run focused tests
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_comercial_operacion_en_curso_repository.py

      - name: Read-only live canary
        shell: bash
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from modules.comercial_analytics.repository_operational import build_current_operation

          result = build_current_operation(
              allowed_unit_codes=[
                  "130MID",
                  "CIENFUEGOS",
                  "ESTELAR",
                  "ORIGEN",
                  "130QRO",
              ]
          )

          print("CUT_AWARE_CURRENT_OPERATION=" + json.dumps(result, default=str, ensure_ascii=False))

          by_unit = {x["unidad_negocio_id"]: x for x in result["items"]}

          qro = by_unit["130QRO"]
          assert qro["current_display_policy"] == "MPRO_PREVIOUS_DATE_BEFORE_FIRST_TURN_OPEN_ONLY"
          assert float(qro["cerradas"]["ventas"]) == 0.0

          cf = by_unit["CIENFUEGOS"]
          assert cf["current_display_policy"] == "SOFT_PREVIOUS_DATE_UNCUT"
          assert float(cf["abiertas"]["ventas"]) > 0

          origen = by_unit["ORIGEN"]
          assert origen["current_display_policy"] == "CURRENT_OPERATION_DATE"

          for code in ("130MID", "ESTELAR"):
              item = by_unit[code]
              if item["current_display_policy"] == "SOFT_PREVIOUS_DATE_AFTER_CUT_OPEN_ONLY":
                  assert float(item["cerradas"]["ventas"]) == 0.0

          print("CUT_AWARE_CANARY=PASS")
          PY
