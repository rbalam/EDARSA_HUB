name: Production Sync Comercial Abiertas Trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-sync-comercial-abiertas-v2-trigger
  cancel-in-progress: false

jobs:
  trigger-production-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDARSA_TRIGGER_URL: https://hub.edarsa.com.mx/api/internal/scheduler-trigger
      EDARSA_TRIGGER_KEY: ${{ secrets.EDARSA_PROD_SCHEDULER_TRIGGER_KEY }}

    steps:
      - name: Verify trigger secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDARSA_TRIGGER_KEY}"

      - name: Verify production trigger health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error               --output "${response_file}"               --write-out "%{http_code}"               --header "X-EDARSA-Scheduler-Key: ${EDARSA_TRIGGER_KEY}"               "${EDARSA_TRIGGER_URL}/health"
          )"
          cat "${response_file}"
          echo
          test "${http_code}" = "200"
          python - "${response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)

          expected = {
              "status": "ready",
              "environment": "PRODUCTION",
              "runtime_role": "PRODUCTION_WEB",
              "trigger_enabled": True,
              "job_id": "sync_comercial_abiertas_v2",
          }

          mismatches = {
              key: {"expected": value, "actual": payload.get(key)}
              for key, value in expected.items()
              if payload.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"HEALTH_CONTRACT_FAILED={mismatches}")

          print("PRODUCTION_TRIGGER_HEALTH=PASS")
          PY

      - name: Trigger canonical Ventas del Dia sync
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error               --output "${response_file}"               --write-out "%{http_code}"               --request POST               --header "X-EDARSA-Scheduler-Key: ${EDARSA_TRIGGER_KEY}"               "${EDARSA_TRIGGER_URL}/sync-comercial-abiertas-v2"
          )"
          cat "${response_file}"
          echo
          test "${http_code}" = "200"
          python - "${response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)

          expected = {
              "status": "executed",
              "environment": "PRODUCTION",
              "runtime_role": "PRODUCTION_WEB",
              "job_id": "sync_comercial_abiertas_v2",
          }

          mismatches = {
              key: {"expected": value, "actual": payload.get(key)}
              for key, value in expected.items()
              if payload.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"TRIGGER_CONTRACT_FAILED={mismatches}")

          print(
              "PRODUCTION_SYNC_COMERCIAL_ABIERTAS_V2=CALLED "
              f"execution_observed={payload.get('execution_observed')}"
          )
          PY
