name: Clientes Canonical Live Audit

on:
  push:
    branches: [audit/clientes-canonical-live-20260825]
    paths:
      - ".github/workflows/clientes-canonical-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EDARSAHUB_SQL_HOST: "54.39.104.176"
      EDARSAHUB_SQL_PORT: "1433"
      EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
      EDARSAHUB_SQL_USER: "HRLectura"
      EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
      SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pymssql cryptography python-dotenv pydantic email-validator passlib bcrypt python-jose
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$EDARSAHUB_SQL_PASSWORD"
          test -n "$SERVER_SECRET_KEY"
          echo "SECRETS_AVAILABLE=YES"
      - name: Obtain live canonical and POS customer schemas
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        shell: bash
        run: |
          python - <<'PY'
          import pymssql
          from core.sql_first.connection_factory import get_edarsahub_pymssql_connection, get_external_sql_connection
          from core.connections.pos_runtime_resolver import list_pos_runtime_contexts

          def print_columns(cursor, schema, table):
              cursor.execute("""
                  SELECT COLUMN_NAME, DATA_TYPE, CHARACTER_MAXIMUM_LENGTH, NUMERIC_PRECISION,
                         NUMERIC_SCALE, IS_NULLABLE, COLUMN_DEFAULT
                  FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE TABLE_SCHEMA=%s AND TABLE_NAME=%s
                  ORDER BY ORDINAL_POSITION
              """, (schema, table))
              print('COLUMNS', schema + '.' + table, cursor.fetchall())

          hub = get_edarsahub_pymssql_connection(timeout=30, login_timeout=10)
          hc = hub.cursor(as_dict=True)
          print('=== HUB CUSTOMER OBJECTS ===')
          hc.execute("""
              SELECT s.name schema_name, o.name object_name, o.type_desc,
                     CASE WHEN o.type='U' THEN SUM(CASE WHEN p.index_id IN (0,1) THEN p.rows ELSE 0 END) ELSE NULL END row_count
              FROM sys.objects o
              JOIN sys.schemas s ON s.schema_id=o.schema_id
              LEFT JOIN sys.partitions p ON p.object_id=o.object_id
              WHERE o.type IN ('U','V') AND (o.name LIKE '%Cliente%' OR o.name LIKE '%Customer%' OR o.name LIKE '%CRM_Cuenta%')
              GROUP BY s.name,o.name,o.type_desc,o.type
              ORDER BY s.name,o.name
          """)
          for r in hc.fetchall(): print('HUB_OBJECT', r)
          for table in ['Cliente_Catalogo','Cliente_Contactos','Cliente_Direcciones','Cliente_Grupos','Sync_Customers','CRM_Cuentas','CavaSocios_Socios']:
              print_columns(hc, 'dbo', table)
              try:
                  hc.execute('SELECT COUNT_BIG(*) n FROM dbo.['+table+']')
                  print('HUB_COUNT', table, hc.fetchone())
              except Exception as exc:
                  print('HUB_COUNT_ERROR', table, type(exc).__name__)
          print('=== HUB KEYS / INDEXES ===')
          hc.execute("""
              SELECT t.name table_name, i.name index_name, i.is_primary_key, i.is_unique,
                     c.name column_name, ic.key_ordinal
              FROM sys.tables t
              JOIN sys.indexes i ON i.object_id=t.object_id
              JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id
              JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id
              WHERE t.name IN ('Cliente_Catalogo','Cliente_Contactos','Sync_Customers','CRM_Cuentas')
              ORDER BY t.name,i.index_id,ic.key_ordinal
          """)
          for r in hc.fetchall(): print('HUB_INDEX', r)
          hub.close()

          print('=== POS LIVE CUSTOMER SCHEMAS ===')
          contexts = list_pos_runtime_contexts(system_types=('SOFTRESTAURANT','MPRO'))
          for ctx in contexts:
              print('SOURCE_BEGIN', {'unidad':ctx.unidad_codigo,'system_type':ctx.system_type,'database':ctx.database,'server_id':ctx.server_id})
              conn = None
              try:
                  cfg = ctx.external_connection_config(as_dict=True)
                  conn = get_external_sql_connection(cfg)
                  cur = conn.cursor(as_dict=True)
                  cur.execute("""
                      SELECT s.name schema_name, t.name table_name,
                             SUM(CASE WHEN p.index_id IN (0,1) THEN p.rows ELSE 0 END) row_count
                      FROM sys.tables t
                      JOIN sys.schemas s ON s.schema_id=t.schema_id
                      LEFT JOIN sys.partitions p ON p.object_id=t.object_id
                      WHERE t.name LIKE '%client%' OR t.name LIKE '%cliente%' OR t.name LIKE '%customer%'
                         OR EXISTS (
                             SELECT 1 FROM sys.columns c
                             WHERE c.object_id=t.object_id
                               AND (c.name LIKE '%client%' OR c.name LIKE '%cliente%' OR c.name LIKE '%customer%'
                                    OR c.name LIKE '%rfc%' OR c.name LIKE '%telefono%' OR c.name LIKE '%email%')
                         )
                      GROUP BY s.name,t.name
                      ORDER BY row_count DESC,t.name
                  """)
                  tables = cur.fetchall()
                  print('SOURCE_TABLES', ctx.unidad_codigo, tables)
                  for tr in tables[:40]:
                      schema=tr['schema_name']; table=tr['table_name']
                      cur.execute("""
                          SELECT COLUMN_NAME,DATA_TYPE,CHARACTER_MAXIMUM_LENGTH,IS_NULLABLE
                          FROM INFORMATION_SCHEMA.COLUMNS
                          WHERE TABLE_SCHEMA=%s AND TABLE_NAME=%s
                          ORDER BY ORDINAL_POSITION
                      """, (schema,table))
                      cols=cur.fetchall()
                      print('SOURCE_SCHEMA', ctx.unidad_codigo, schema+'.'+table, cols)
                  print('SOURCE_END', ctx.unidad_codigo)
              except Exception as exc:
                  print('SOURCE_ERROR', ctx.unidad_codigo, type(exc).__name__, str(exc)[:240])
              finally:
                  if conn:
                      conn.close()
          PY
