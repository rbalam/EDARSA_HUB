name: Ticket Detail Contract Diagnostic

on:
  push:
    branches:
      - fix/comercial-ticket-detail-contract-20261013
    paths:
      - ".github/workflows/ticket-detail-contract-diagnostic.yml"
      - "backend/tools/diag_ticket_detail_contract.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  EDARSA_ENV: DEVELOPMENT
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ticket-diag.txt
          python -m pip install -r /tmp/requirements-ticket-diag.txt
      - name: Run read-only ticket diagnostic
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/diag_ticket_detail_contract.py
