name: Commercial Open Sales Clock

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/commercial-open-sales-clock.yml"
  workflow_dispatch:
  # Recovery only; the existing self-relay remains the primary cadence.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: commercial-open-sales-clock
  cancel-in-progress: false

env:
  EDARSA_ENV: DEVELOPMENT
  SCHEDULER_SYNC_COMERCIAL_ABIERTAS_V2_ENABLED: "true"
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
  SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}

jobs:
  open-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture cycle start
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Evaluate missed-relay recovery
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          def output(value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("should_run=" + ("true" if value else "false") + "\n")

          if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
              output(True)
              print("RECOVERY_GATE=STANDARD_SELF_RELAY")
              raise SystemExit(0)

          url = (
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
              + "/actions/workflows/commercial-open-sales-clock.yml/runs"
              + "?branch=Edarsahub_Desarrollo&event=workflow_dispatch&per_page=20"
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          # Fail closed: a failed status API must not cause duplicate job execution.
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  payload = json.load(response)
          except Exception as exc:
              output(False)
              print("RECOVERY_GATE=API_UNAVAILABLE:" + type(exc).__name__)
              raise SystemExit(1)

          now = datetime.datetime.now(datetime.timezone.utc)
          recent = False
          for run in payload.get("workflow_runs", []):
              if run.get("event") != "workflow_dispatch":
                  continue
              started = run.get("created_at")
              if not started:
                  continue
              ts = datetime.datetime.fromisoformat(started.replace("Z", "+00:00"))
              if datetime.timedelta(0) <= now-ts < datetime.timedelta(minutes=8):
                  recent = True
                  break

          output(not recent)
          print("RECOVERY_GATE=" + ("SELF_RELAY_ACTIVE_SKIP" if recent else "MISSED_RELAY_RUN"))
          PY

      - if: ${{ steps.recovery.outputs.should_run == 'true' }}
        uses: actions/checkout@v4

      - if: ${{ steps.recovery.outputs.should_run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies
        if: ${{ steps.recovery.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-commercial-owner.txt
          python -m pip install -r /tmp/requirements-commercial-owner.txt

      - name: Validate external owner secrets
        if: ${{ steps.recovery.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          test -n "$EDARSAHUB_SQL_PASSWORD"
          test -n "$SERVER_SECRET_KEY"

      - name: Run canonical Ventas del Dia
        if: ${{ steps.recovery.outputs.should_run == 'true' }}
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/run_commercial_github_owner.py open_sales --require-executed

      - name: Relay next open-sales cycle at 5 minutes
        if: ${{ always() && steps.recovery.outputs.should_run == 'true' && vars.EDARSA_COMMERCIAL_RELAY_ENABLED != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          target="$((STARTED_EPOCH + 300))"
          wait_seconds="$((target - now))"
          if [ "$wait_seconds" -gt 0 ]; then
            echo "OPEN_SALES_RELAY_WAIT_SECONDS=$wait_seconds"
            sleep "$wait_seconds"
          fi

          payload='{"ref":"Edarsahub_Desarrollo"}'
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/commercial-open-sales-clock.yml/dispatches" \
              --data "$payload"; then
              echo "OPEN_SALES_RELAY=DISPATCHED"
              exit 0
            fi
            echo "OPEN_SALES_RELAY_RETRY=$attempt"
            sleep "$((attempt * 5))"
          done

          echo "OPEN_SALES_RELAY=FAILED"
          exit 1

      - name: Publish failure notice in workflow summary
        if: ${{ failure() && steps.recovery.outputs.should_run == 'true' }}
        shell: bash
        run: |
          echo "### Commercial clock execution failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Clock: 5 minutes. The next scheduled recovery will check for stale relay runs." >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect the canonical owner, source-level results and lock before manual replay." >> "$GITHUB_STEP_SUMMARY"
