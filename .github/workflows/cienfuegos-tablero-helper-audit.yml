name: CIENFUEGOS Tablero Helper Audit

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/cienfuegos-tablero-helper-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      EDARSAHUB_SQL_HOST: "54.39.104.176"
      EDARSAHUB_SQL_PORT: "1433"
      EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
      EDARSAHUB_SQL_USER: "HRLectura"
      EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pymssql
      - name: Run canonical helper exactly as tablero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pymssql
          from core.inventarios.analysis_soft_sources import _fetch_soft_ledger_net

          server_id="6d053c22-523e-48c0-b72b-96081e2d781b"
          visible=[
              "A100067","A100202","A100235","A100306","A100410",
              "A200180","A400081","A400092","A400104","A400107",
              "A400109","A400111","A400151","A400152","A900005",
          ]

          conn=pymssql.connect(
              server=os.environ["EDARSAHUB_SQL_HOST"],
              port=int(os.environ["EDARSAHUB_SQL_PORT"]),
              database=os.environ["EDARSAHUB_SQL_DATABASE"],
              user=os.environ["EDARSAHUB_SQL_USER"],
              password=os.environ["EDARSAHUB_SQL_PASSWORD"],
              login_timeout=15,
              timeout=60,
              as_dict=True,
          )
          cur=conn.cursor(as_dict=True)

          result=_fetch_soft_ledger_net(
              cur,
              server_id=server_id,
              unidad_codigo="CIENFUEGOS",
              sucursal_origen_id="",
              fecha_ini="2026-10-01 00:00:01",
              fecha_fin="2026-10-19 23:59:59",
              warehouses=["149","200","200 BARRA"],
              visible_product_codes=visible,
          )

          subset={code: result.get(code,0) for code in visible}
          print("CIENFUEGOS_TABLERO_HELPER="+json.dumps(subset,ensure_ascii=False,default=str))
          print("CIENFUEGOS_TABLERO_HELPER_NONZERO="+str(sum(1 for x in subset.values() if abs(float(x or 0))>0)))
          cur.close(); conn.close()
          if sum(1 for x in subset.values() if abs(float(x or 0))>0) < 1:
              raise SystemExit("TABLERO_HELPER_RETURNED_ZERO")
          PY
