name: SoftRestaurant Insumos Catalog Clock

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/softrestaurant-insumos-catalog-clock.yml"
      - "backend/tools/run_soft_insumos_github_owner.py"
      - "backend/modules/sync_recetas/sync_recetas.py"

permissions:
  contents: read

concurrency:
  group: softrestaurant-insumos-catalog-clock
  cancel-in-progress: false

env:
  EDARSA_ENV: DEVELOPMENT
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
  SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}

jobs:
  sync-soft-insumos:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install SQL preflight runtime
        run: python -m pip install --quiet pymssql

      - name: Verify catalog DML permissions
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pymssql

          required = {
              "dbo.Sync_Productos_Insumos": ("SELECT","INSERT","UPDATE"),
              "dbo.Sync_Control_Ejecuciones": ("SELECT","INSERT","UPDATE"),
          }

          conn=pymssql.connect(
              server=os.environ["EDARSAHUB_SQL_HOST"],
              port=int(os.environ["EDARSAHUB_SQL_PORT"]),
              database=os.environ["EDARSAHUB_SQL_DATABASE"],
              user=os.environ["EDARSAHUB_SQL_USER"],
              password=os.environ["EDARSAHUB_SQL_PASSWORD"],
              login_timeout=15, timeout=30, as_dict=True,
          )
          cur=conn.cursor(as_dict=True)
          missing=[]
          for obj,perms in required.items():
              for perm in perms:
                  cur.execute(
                      "SELECT COALESCE(HAS_PERMS_BY_NAME(%s,'OBJECT',%s),0) allowed",
                      (obj,perm),
                  )
                  allowed=int(cur.fetchone()["allowed"] or 0)
                  print(f"PERMISSION {obj} {perm}={allowed}")
                  if allowed != 1:
                      missing.append(f"{obj}:{perm}")
          cur.close(); conn.close()
          if missing:
              raise SystemExit("SOFT_INSUMOS_DML_MISSING="+",".join(missing))
          print("SOFT_INSUMOS_DML_PREFLIGHT=PASS")
          PY

          echo "EDARSAHUB_SQL_WRITER_USER=$EDARSAHUB_SQL_USER" >> "$GITHUB_ENV"
          echo "EDARSAHUB_SQL_WRITER_PASSWORD=$EDARSAHUB_SQL_PASSWORD" >> "$GITHUB_ENV"

      - name: Install backend runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-soft-insumos.txt
          python -m pip install -r /tmp/requirements-soft-insumos.txt

      - name: Refresh canonical SoftRestaurant insumos
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/run_soft_insumos_github_owner.py
