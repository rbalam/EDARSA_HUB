name: MPRO CTRL1 Reconciliation Contract Gate

on:
  pull_request:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - "backend/core/inventarios/reconcile_mpro_ctrl1.py"
      - "backend/tests/test_reconcile_mpro_ctrl1.py"
      - ".github/workflows/mpro-130qro-ctrl1-reconcile.yml"
      - ".github/workflows/mpro-130qro-ctrl1-contract.yml"
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - "backend/core/inventarios/reconcile_mpro_ctrl1.py"
      - "backend/tests/test_reconcile_mpro_ctrl1.py"
      - ".github/workflows/mpro-130qro-ctrl1-reconcile.yml"
      - ".github/workflows/mpro-130qro-ctrl1-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile isolated reconciliation
        run: python -m py_compile backend/core/inventarios/reconcile_mpro_ctrl1.py backend/tests/test_reconcile_mpro_ctrl1.py
      - name: Run deterministic no-SQL regression tests
        run: |
          python -m pip install --quiet pytest python-dotenv
          cd backend
          PYTHONPATH=. python -m pytest -q tests/test_reconcile_mpro_ctrl1.py
      - name: Verify no forbidden synchronizers in patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Edarsahub_Desarrollo --depth=1
          files="$(git diff --name-only origin/Edarsahub_Desarrollo...HEAD)"
          printf '%s\n' "$files"
          if echo "$files" | grep -E '(^backend/core/scheduler/jobs/sync_comercial_|^backend/modules/comercial_v2/|^backend/core/inventarios/sync_movimientos_canonico.py$)'; then
            echo "FORBIDDEN_SYNC_MODIFICATION"
            exit 1
          fi
