name: Commercial Closed Sales Clock

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/commercial-closed-sales-clock.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: commercial-closed-sales-clock
  cancel-in-progress: false

env:
  EDARSA_ENV: DEVELOPMENT
  SCHEDULER_SYNC_COMERCIAL_V2_ENABLED: "true"
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
  SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}

jobs:
  closed-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture cycle start
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-commercial-owner.txt
          python -m pip install -r /tmp/requirements-commercial-owner.txt

      - name: Validate external owner secrets
        run: |
          set -euo pipefail
          test -n "$EDARSAHUB_SQL_PASSWORD"
          test -n "$SERVER_SECRET_KEY"

      - name: Run canonical Ventas Cerradas
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/run_commercial_github_owner.py closed_sales

      - name: Relay next closed-sales cycle at 15 minutes
        if: ${{ always() && vars.EDARSA_COMMERCIAL_RELAY_ENABLED != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          target="$((STARTED_EPOCH + 900))"
          wait_seconds="$((target - now))"
          if [ "$wait_seconds" -gt 0 ]; then
            echo "CLOSED_SALES_RELAY_WAIT_SECONDS=$wait_seconds"
            sleep "$wait_seconds"
          fi

          payload='{"ref":"Edarsahub_Desarrollo"}'
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/commercial-closed-sales-clock.yml/dispatches" \
              --data "$payload"; then
              echo "CLOSED_SALES_RELAY=DISPATCHED"
              exit 0
            fi
            echo "CLOSED_SALES_RELAY_RETRY=$attempt"
            sleep "$((attempt * 5))"
          done

          echo "CLOSED_SALES_RELAY=FAILED"
          exit 1
