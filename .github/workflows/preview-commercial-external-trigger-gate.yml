name: Preview Commercial External Trigger Gate

on:
  push:
    branches:
      - Edarsahub_Desarrollo
      - fix/preview-commercial-external-trigger-20261012
    paths:
      - "backend/modules/scheduler_trigger_preview/**"
      - "backend/server.py"
      - "backend/modules/scheduler_runtime/policy.py"
      - "backend/tests/test_scheduler_runtime_policy.py"
      - "backend/tests/test_preview_scheduler_http_trigger.py"
      - "backend/tools/run_commercial_github_owner.py"
      - ".github/workflows/preview-commercial-external-trigger-gate.yml"
      - ".github/workflows/preview-commercial-external-owner.yml"
      - ".github/workflows/commercial-open-sales-clock.yml"
      - ".github/workflows/commercial-closed-sales-clock.yml"
  pull_request:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - "backend/modules/scheduler_trigger_preview/**"
      - "backend/server.py"
      - "backend/modules/scheduler_runtime/policy.py"
      - "backend/tests/test_scheduler_runtime_policy.py"
      - "backend/tests/test_preview_scheduler_http_trigger.py"
      - "backend/tools/run_commercial_github_owner.py"
      - ".github/workflows/preview-commercial-external-trigger-gate.yml"
      - ".github/workflows/preview-commercial-external-owner.yml"
      - ".github/workflows/commercial-open-sales-clock.yml"
      - ".github/workflows/commercial-closed-sales-clock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-atomic-transversal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Protect certified synchronizers and owners byte-for-byte
        run: |
          test "$(git hash-object backend/core/scheduler/jobs/sync_comercial_abiertas_v2_job.py)" = "47e7e005cf3c382c546ffc017a28a5c6d87796bc"
          test "$(git hash-object backend/core/scheduler/jobs/sync_comercial_v2_job.py)" = "da0173ac0b482ee3139e716c02f5235c8d747755"
          test "$(git hash-object backend/modules/scheduler_runtime/preview_sales_wake.py)" = "c0c7c5e8c435993fe708d8fbb6894b80140fa257"
          test "$(git hash-object backend/modules/scheduler_runtime/preview_closed_sales_wake.py)" = "97c54c5a430f721a7159de287a185c3b3d59fed6"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Compile trigger and external owner adapter
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m py_compile \
            backend/modules/scheduler_trigger_preview/routes.py \
            backend/modules/scheduler_runtime/policy.py \
            backend/tools/run_commercial_github_owner.py

      - name: Run trigger ownership contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest -q --tb=short             backend/tests/test_preview_scheduler_http_trigger.py             backend/tests/test_preview_sales_wake.py             backend/tests/test_preview_closed_sales_wake.py             backend/tests/test_preview_scoped_scheduler.py             backend/tests/test_scheduler_runtime_policy.py

      - name: Assert isolated change surface
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "${PUSH_BEFORE_SHA:-}" ] \
            && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          echo "CHANGE_SURFACE_BASE_SHA=$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/preview-trigger-files.txt
          cat /tmp/preview-trigger-files.txt
          python - <<'PY'
          from pathlib import Path

          commercial_exact = {
              ".github/workflows/preview-commercial-external-trigger-gate.yml",
              ".github/workflows/preview-commercial-external-owner.yml",
              ".github/workflows/commercial-open-sales-clock.yml",
              ".github/workflows/commercial-closed-sales-clock.yml",
              "backend/modules/scheduler_runtime/policy.py",
              "backend/tests/test_scheduler_runtime_policy.py",
              "backend/tests/test_preview_scheduler_http_trigger.py",
              "backend/tools/run_commercial_github_owner.py",
          }
          commercial_prefixes = (
              "backend/modules/scheduler_trigger_preview/",
          )

          changed = [
              line.strip()
              for line in Path("/tmp/preview-trigger-files.txt").read_text().splitlines()
              if line.strip()
          ]
          commercial_changed = [
              path
              for path in changed
              if path in commercial_exact
              or path.startswith(commercial_prefixes)
          ]

          # backend/server.py is shared by many modules. If no Commercial-owned
          # file changed, allow unrelated router mounts only after proving the
          # Commercial trigger/owner references in server.py are byte-for-byte
          # unchanged across the PR range.
          if not commercial_changed:
              if "backend/server.py" in changed:
                  import subprocess

                  diff = subprocess.run(
                      ["git", "diff", "--unified=0", "$BASE_SHA...HEAD", "--", "backend/server.py"],
                      check=True,
                      stdout=subprocess.PIPE,
                      text=True,
                  ).stdout
                  protected_markers = (
                      "scheduler_trigger_preview",
                      "preview_scheduler_trigger_router",
                      "preview commercial",
                      "sync_comercial_abiertas_v2",
                      "sync_comercial_v2",
                  )
                  touched = [
                      line for line in diff.splitlines()
                      if line.startswith(("+", "-"))
                      and not line.startswith(("+++", "---"))
                      and any(marker.lower() in line.lower() for marker in protected_markers)
                  ]
                  if touched:
                      raise SystemExit(
                          "COMMERCIAL_SERVER_REFERENCES_CHANGED=" + repr(touched)
                      )
              print("CANONICAL_ATOMIC_TRANSVERSAL_SURFACE=PASS_UNRELATED")
              raise SystemExit(0)

          allowed_exact = commercial_exact | {"backend/server.py"}
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and not path.startswith(commercial_prefixes)
          ]
          if unexpected:
              raise SystemExit(f"UNEXPECTED_CHANGE_SURFACE={unexpected}")
          print("CANONICAL_ATOMIC_TRANSVERSAL_SURFACE=PASS")
          PY
