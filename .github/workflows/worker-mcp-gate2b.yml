name: Worker MCP Gate2B

on:
  push:
    branches: [Edarsahub_Desarrollo]
    paths:
      - "backend/modules/worker_mcp/**"
      - ".github/workflows/worker-mcp-gate2b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/modules/worker_mcp/requirements.txt

      - name: Install isolated MCP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/modules/worker_mcp/requirements.txt

      - name: Run Gate2B MCP tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/modules
        run: |
          python -m pytest             backend/modules/worker_mcp/tests/test_gate2b.py             -q --tb=short
