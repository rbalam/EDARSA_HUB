name: R38 OAuth unit tests
on:
  pull_request:
    paths:
      - "backend/modules/worker_mcp/oauth_*.py"
      - "backend/tests/test_worker_mcp_oauth_*.py"
      - ".github/workflows/r38-oauth-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install "pytest==9.0.2" "python-dotenv==1.1.1"
      - name: Prepare isolated OAuth test package
        run: |
          mkdir -p /tmp/r38-oauth/modules/worker_mcp /tmp/r38-oauth/tests
          touch /tmp/r38-oauth/modules/__init__.py /tmp/r38-oauth/modules/worker_mcp/__init__.py
          cp backend/modules/worker_mcp/oauth_discovery.py /tmp/r38-oauth/modules/worker_mcp/
          cp backend/modules/worker_mcp/oauth_pkce.py /tmp/r38-oauth/modules/worker_mcp/
          cp backend/modules/worker_mcp/oauth_security.py /tmp/r38-oauth/modules/worker_mcp/
          cp backend/tests/test_worker_mcp_oauth_discovery.py /tmp/r38-oauth/tests/
          cp backend/tests/test_worker_mcp_oauth_pkce.py /tmp/r38-oauth/tests/
          cp backend/tests/test_worker_mcp_oauth_security.py /tmp/r38-oauth/tests/
      - name: Validate OAuth Discovery PKCE and Security
        env:
          PYTHONPATH: /tmp/r38-oauth
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -c /dev/null -p no:cacheprovider /tmp/r38-oauth/tests
