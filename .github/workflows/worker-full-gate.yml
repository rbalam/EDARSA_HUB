name: Worker Full Gate

on:
  push:
    branches: [Edarsahub_Desarrollo]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/mirror_sync/**"
      - ".github/workflows/worker-full-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install public backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Run deterministic backend gate
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest \
            backend/tests/test_iscam_scheduler_definitive_fix_r80c.py \
            backend/tests/test_scheduler_rsync_manual_r74.py \
            backend/tests/test_admin_scheduler_resync_origin_contract.py \
            backend/tests/test_iscam_detail_only_manual_resync_r37.py \
            backend/tests/test_scheduler_comercial_status.py \
            backend/tests/test_iscam_no_prorate_adjustments_r49.py \
            backend/tests/test_iscam_detail_pax_ticket_aggregation.py \
            -q --tb=short
      - name: Run legacy full backend suite (diagnostic only)
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest backend/tests -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build frontend using canonical worker command
        working-directory: frontend
        run: yarn build
