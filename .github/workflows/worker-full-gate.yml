name: Worker Full Gate

on:
  push:
    branches: [Edarsahub_Desarrollo]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/mirror_sync/**"
      - ".github/workflows/worker-full-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install public backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Run backend test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest backend/tests -q --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build frontend using canonical worker command
        working-directory: frontend
        run: yarn build
