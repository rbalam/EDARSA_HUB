name: Universal Worker Wake Now
# recovery trigger 2026-09-17T19:27-06:00 gate5d dedicated-writer contract ff-refresh

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - '.github/workflows/universal-worker-wake-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve current queue SHA
        id: queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/rbalam/EDARSA_HUB.git"
          SHA="$(git ls-remote "$AUTH_URL" refs/heads/worker/requests | awk '{print $1}')"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "QUEUE_SHA=$SHA"

      - name: Wake Preview Universal Worker
        shell: bash
        env:
          QUEUE_SHA: ${{ steps.queue.outputs.sha }}
        run: |
          set -euo pipefail
          URL='https://erp-crm-enterprise-1.preview.emergentagent.com/api/internal/worker/wake'
          HTTP_CODE="$(curl --silent --show-error --location             --output /tmp/wake.json             --write-out '%{http_code}'             --request POST "$URL"             --header "X-Worker-Queue-Sha: $QUEUE_SHA"             --header 'Content-Type: application/json'             --data '{}')"
          cat /tmp/wake.json || true
          echo "HTTP_CODE=$HTTP_CODE"
          case "$HTTP_CODE" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Confirm production untouched
        shell: bash
        run: |
          echo 'PRODUCTION_TOUCHED=NO'
