name: Production Scheduler HTTP Trigger Gate

on:
  push:
    branches:
      - hotfix/prod-scheduler-http-trigger-20261010
    paths:
      - "backend/modules/scheduler_trigger/**"
      - "backend/server.py"
      - "backend/tests/test_scheduler_http_trigger.py"
      - "docs/SCHEDULER/PRODUCTION_HTTP_TRIGGER_20261010.md"
      - ".github/workflows/prod-scheduler-http-trigger-gate.yml"
  pull_request:
    branches:
      - Edarsahub_Produccion
    paths:
      - "backend/modules/scheduler_trigger/**"
      - "backend/server.py"
      - "backend/tests/test_scheduler_http_trigger.py"
      - "docs/SCHEDULER/PRODUCTION_HTTP_TRIGGER_20261010.md"
      - ".github/workflows/prod-scheduler-http-trigger-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-trigger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect production day-sales synchronizer
        run: |
          test "$(git hash-object backend/core/scheduler/jobs/sync_comercial_abiertas_v2_job.py)" =             "e97b55a06b0adb5b447904c7643b99844f00aae7"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Compile trigger
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m py_compile             backend/modules/scheduler_trigger/routes.py             backend/modules/scheduler_runtime/policy.py

      - name: Run trigger and ownership contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest -q --tb=short             backend/tests/test_scheduler_http_trigger.py             backend/tests/test_scheduler_runtime_policy.py             backend/tests/test_sync_comercial_abiertas_v2_immutable.py

      - name: Assert protected synchronizer absent from hotfix diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" > /tmp/http-trigger-files.txt
          else
            git diff --name-only 98bc2df0e1b1bc8ff69fc1fc544b5ad75358df15...HEAD > /tmp/http-trigger-files.txt
          fi
          cat /tmp/http-trigger-files.txt
          ! grep -Fx "backend/core/scheduler/jobs/sync_comercial_abiertas_v2_job.py" /tmp/http-trigger-files.txt

      - name: Assert isolated hotfix paths only
        run: |
          python - <<'PY'
          from pathlib import Path

          allowed_exact = {
              ".github/workflows/prod-scheduler-http-trigger-gate.yml",
              "backend/server.py",
              "backend/tests/test_scheduler_http_trigger.py",
              "docs/SCHEDULER/PRODUCTION_HTTP_TRIGGER_20261010.md",
          }
          allowed_prefixes = (
              "backend/modules/scheduler_trigger/",
          )

          changed = [
              line.strip()
              for line in Path("/tmp/http-trigger-files.txt").read_text().splitlines()
              if line.strip()
          ]
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f"UNEXPECTED_HOTFIX_PATHS={unexpected}")
          print("ISOLATED_HOTFIX_PATHS=PASS")
          PY
