name: Worker Runtime Recovery Probe
# Manual retrigger 2026-09-17T13:27-06:00. Recupera el Universal Worker usando como prueba autoritativa el endpoint real de wake para Gate22A-R3.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      preferred_job_id:
        description: 'Job existente en worker/requests que debe recibir preferencia'
        required: false
        type: string
      preview_url:
        description: 'Override opcional de URL publica del runtime'
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: edarsahub-worker-runtime-recovery
  cancel-in-progress: false

jobs:
  probe-and-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL_OVERRIDE: ${{ inputs.preview_url || vars.EDARSAHUB_PREVIEW_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve preferred job from control-plane input
        id: preferred
        shell: bash
        env:
          INPUT_PREFERRED_JOB_ID: ${{ inputs.preferred_job_id || '' }}
        run: |
          set -euo pipefail
          JOB_ID="${INPUT_PREFERRED_JOB_ID:-}"
          if [ -n "$JOB_ID" ] && ! [[ "$JOB_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,120}$ ]]; then
            echo 'INVALID_PREFERRED_JOB_ID'
            exit 14
          fi
          echo "preferred_job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "PREFERRED_JOB_ID=${JOB_ID:-none}"

      - name: Resolve worker queue head
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          QUEUE_SHA="$(git ls-remote origin refs/heads/worker/requests | awk '{print $1}')"
          test "${#QUEUE_SHA}" -eq 40
          echo "queue_sha=$QUEUE_SHA" >> "$GITHUB_OUTPUT"
          echo "QUEUE_SHA=$QUEUE_SHA"

      - name: Resolve canonical runtime URL
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          CONFIG='worker_queue/config/runtime-recovery.json'
          test -r "$CONFIG"
          CANONICAL_URL="$(jq -r '.canonical_public_url // empty' "$CONFIG")"
          if [ -n "${PREVIEW_URL_OVERRIDE:-}" ]; then
            CANONICAL_URL="${PREVIEW_URL_OVERRIDE%/}"
          fi
          test -n "$CANONICAL_URL"
          case "$CANONICAL_URL" in
            https://*) ;;
            *) echo 'INVALID_CANONICAL_RUNTIME_URL'; exit 13;;
          esac
          echo "runtime_url=${CANONICAL_URL%/}" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_RUNTIME_URL=${CANONICAL_URL%/}"

      - name: Wake canonical Universal Worker through authoritative endpoint
        id: wake
        continue-on-error: true
        shell: bash
        env:
          QUEUE_SHA: ${{ steps.queue.outputs.queue_sha }}
          RUNTIME_URL: ${{ steps.runtime.outputs.runtime_url }}
          PREFERRED_JOB_ID: ${{ steps.preferred.outputs.preferred_job_id }}
        run: |
          set -euo pipefail
          FINAL_HTTP=000
          FINAL_STATE=FAILED
          FINAL_DETAIL=unavailable

          for attempt in 1 2 3 4 5 6; do
            echo "WAKE_ATTEMPT=$attempt"
            HTTP_CODE="$(curl --silent --show-error \
              --connect-timeout 5 --max-time 25 \
              -o /tmp/wake-body.txt -w '%{http_code}' \
              -X POST \
              -H "X-Worker-Queue-Sha: ${QUEUE_SHA}" \
              -H "X-Worker-Preferred-Job-Id: ${PREFERRED_JOB_ID:-}" \
              "$RUNTIME_URL/api/internal/worker/wake" || true)"

            FINAL_HTTP="$HTTP_CODE"
            BODY="$(cat /tmp/wake-body.txt 2>/dev/null || true)"
            echo "WAKE_HTTP_CODE=$HTTP_CODE"
            printf '%s\n' "$BODY"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              FINAL_STATE="$(printf '%s' "$BODY" | jq -r '.runtime_convergence.state // "ACCEPTED"' 2>/dev/null || echo ACCEPTED)"
              FINAL_DETAIL="$(printf '%s' "$BODY" | jq -r '.runtime_convergence.new_sha // .runtime_convergence.remote_sha // .runtime_convergence.local_sha // "accepted"' 2>/dev/null || echo accepted)"
              echo "WORKER_WAKE_ACCEPTED=1"
              break
            fi

            FINAL_DETAIL="$(printf '%s' "$BODY" | jq -r '.detail // "http_'"$HTTP_CODE"'"' 2>/dev/null || echo "http_$HTTP_CODE")"
            if [ "$HTTP_CODE" = "429" ]; then
              echo "WORKER_WAKE_ROUTE_REACHABLE_COOLDOWN=1"
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done

          FINAL_DETAIL="$(printf '%s' "$FINAL_DETAIL" | tr '\n\r' '  ' | cut -c1-100)"
          echo "http_code=$FINAL_HTTP" >> "$GITHUB_OUTPUT"
          echo "convergence_state=$FINAL_STATE" >> "$GITHUB_OUTPUT"
          echo "detail=$FINAL_DETAIL" >> "$GITHUB_OUTPUT"
          if [ "$FINAL_HTTP" = "200" ] || [ "$FINAL_HTTP" = "202" ]; then exit 0; fi
          exit 12

      - name: Publish sanitized runtime convergence status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_OUTCOME: ${{ steps.wake.outcome }}
          HTTP_CODE: ${{ steps.wake.outputs.http_code }}
          CONVERGENCE_STATE: ${{ steps.wake.outputs.convergence_state }}
          DETAIL: ${{ steps.wake.outputs.detail }}
        run: |
          set -euo pipefail
          if [ "$WAKE_OUTCOME" = "success" ]; then STATE=success; else STATE=failure; fi
          DESC="http=${HTTP_CODE:-na} convergence=${CONVERGENCE_STATE:-FAILED} detail=${DETAIL:-unavailable}"
          DESC="$(printf '%s' "$DESC" | cut -c1-140)"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='edarsahub/runtime-convergence' \
            -f description="$DESC" >/dev/null
          echo "RUNTIME_CONVERGENCE_STATUS=$STATE"
          echo "RUNTIME_CONVERGENCE_DESCRIPTION=$DESC"

      - name: Enforce wake success
        if: steps.wake.outcome != 'success'
        shell: bash
        run: exit 12
