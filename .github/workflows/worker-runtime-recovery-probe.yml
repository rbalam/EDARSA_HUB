name: Worker Runtime Recovery Probe
# Recupera el Universal Worker usando como prueba autoritativa el endpoint real de wake.

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - '.github/workflows/worker-runtime-recovery-probe.yml'
      - 'worker_queue/triggers/runtime-recovery/**'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Override opcional de URL Preview de Emergent'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: edarsahub-worker-runtime-recovery
  cancel-in-progress: false

jobs:
  probe-and-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_URL_OVERRIDE: ${{ inputs.preview_url || vars.EDARSAHUB_PREVIEW_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve worker queue head
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          QUEUE_SHA="$(git ls-remote origin refs/heads/worker/requests | awk '{print $1}')"
          test "${#QUEUE_SHA}" -eq 40
          echo "queue_sha=$QUEUE_SHA" >> "$GITHUB_OUTPUT"
          echo "QUEUE_SHA=$QUEUE_SHA"

      - name: Wake canonical Universal Worker through authoritative endpoint
        shell: bash
        env:
          QUEUE_SHA: ${{ steps.queue.outputs.queue_sha }}
        run: |
          set -euo pipefail

          candidates=()
          if [ -n "${PREVIEW_URL_OVERRIDE:-}" ]; then
            candidates+=("${PREVIEW_URL_OVERRIDE%/}")
          fi
          candidates+=(
            'https://stock-tracker-990.preview.emergentagent.com'
            'https://erp-crm-enterprise-1.preview.emergentagent.com'
            'https://edarsa-hub-preview.emergentagent.com'
          )

          # No depender de rutas funcionales como /api/v2/comercial/dashboard:
          # durante cold-start o despliegues parciales pueden devolver 404 aunque
          # el control plane del Worker siga disponible. La unica prueba autoritativa
          # para esta recuperacion es POST /api/internal/worker/wake.
          for attempt in 1 2 3 4 5 6; do
            echo "WAKE_DISCOVERY_ATTEMPT=$attempt"
            for candidate in "${candidates[@]}"; do
              candidate="${candidate%/}"
              [ -n "$candidate" ] || continue

              HTTP_CODE="$(curl --silent --show-error \
                --connect-timeout 5 --max-time 25 \
                -o /tmp/wake-body.txt -w '%{http_code}' \
                -X POST \
                -H "X-Worker-Queue-Sha: ${QUEUE_SHA}" \
                "$candidate/api/internal/worker/wake" || true)"

              echo "WAKE_CANDIDATE=$candidate HTTP_CODE=$HTTP_CODE"
              cat /tmp/wake-body.txt || true
              echo

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
                echo "WORKER_WAKE_ACCEPTED=1"
                echo "WORKER_WAKE_URL=$candidate"
                exit 0
              fi

              # 429 confirma que la ruta correcta existe y esta en cooldown;
              # seguimos reintentando hasta obtener la aceptacion 200/202.
              if [ "$HTTP_CODE" = "429" ]; then
                echo "WORKER_WAKE_ROUTE_REACHABLE_COOLDOWN=1"
              fi
            done

            if [ "$attempt" -lt 6 ]; then
              sleep 8
            fi
          done

          echo "WORKER_WAKE_ACCEPTED=0"
          exit 12
