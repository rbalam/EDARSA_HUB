name: COA Core Development Migration

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ops/migrations/requests/COA-CORE-20260909.execute

permissions:
  contents: read

concurrency:
  group: coa-core-development-migration
  cancel-in-progress: false

jobs:
  migrate-coa-core-development:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    env:
      EDARSAHUB_SQL_HOST: '54.39.104.176'
      EDARSAHUB_SQL_PORT: '1433'
      EDARSAHUB_SQL_DATABASE: 'EDARSAHUB'
      MIGRATION_SCRIPT: backend/database/migrations/20260909_coa_core.sql
      ROLLBACK_SCRIPT: backend/database/migrations/20260909_coa_core_rollback.sql

    steps:
      - name: Checkout exact Development commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQL runtime
        run: python -m pip install pymssql pydantic python-dotenv email-validator

      - name: Preflight with readonly canonical account
        env:
          EDARSAHUB_SQL_USER: HRLectura
          EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "${GITHUB_REF}" = 'refs/heads/Edarsahub_Desarrollo'
          test -f "${MIGRATION_SCRIPT}"
          test -f "${ROLLBACK_SCRIPT}"
          python - <<'PY' | tee evidence/preflight.txt
          import os,pymssql
          conn=pymssql.connect(server=os.environ['EDARSAHUB_SQL_HOST'],port=int(os.environ['EDARSAHUB_SQL_PORT']),database=os.environ['EDARSAHUB_SQL_DATABASE'],user=os.environ['EDARSAHUB_SQL_USER'],password=os.environ['EDARSAHUB_SQL_PASSWORD'],timeout=60,login_timeout=15)
          cur=conn.cursor(as_dict=True)
          names=['COA_Expedientes','COA_ExpedienteEventos','COA_ExpedienteReferencias','COA_ReglasComision','COA_ReglasComisionCondiciones','COA_ExcepcionesRegla','COA_ComisionAplicada']
          cur.execute("SELECT name FROM sys.tables WHERE name IN (%s)" % ','.join(["'%s'"%n for n in names]))
          rows=cur.fetchall(); print({'existing_coa_tables':rows})
          if rows: raise SystemExit('COA_PREFLIGHT_OBJECT_COLLISION')
          refs=[('Sistema_Empresas','EmpresaID'),('Unidades_Negocio','id'),('Usuario_Catalogo','UsuarioID'),('Cliente_Catalogo','ClienteID'),('Proveedor_Catalogo','ProveedorID'),('Proveedor_Monedas','MonedaID'),('Compras_DocumentosFiscales','DocumentoFiscalID'),('Finanzas_Pagos','PagoID'),('Finanzas_CxP_DecisionesPago','DecisionPagoID'),('RH_Nomina','NominaID'),('RH_Nomina_Dispersion','DispersionNominaID'),('RH_Nomina_Recibos','NominaReciboID'),('RH_Colaboradores_Expediente','ColaboradorID'),('CRM_Contratos','ContratoID')]
          for t,c in refs:
              cur.execute("SELECT COUNT(*) AS n FROM sys.columns WHERE object_id=OBJECT_ID(%s) AND name=%s",('dbo.'+t,c))
              if int(cur.fetchone()['n'])!=1: raise SystemExit('COA_PREFLIGHT_REFERENCE_MISSING:%s.%s'%(t,c))
          cur.close(); conn.close(); print('COA_PREFLIGHT=PASS')
          PY

      - name: Resolve configured SQL access and verify DDL permission
        env:
          EDARSAHUB_SQL_USER: HRLectura
          EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDARSAHUB_SQL_PASSWORD:-}"
          echo "EDARSAHUB_SQL_USER=HRLectura" >> "$GITHUB_ENV"
          echo "EDARSAHUB_SQL_PASSWORD=${EDARSAHUB_SQL_PASSWORD}" >> "$GITHUB_ENV"
          python - <<'PY' | tee evidence/writer-permissions.txt
          import os,pymssql
          conn=pymssql.connect(server=os.environ['EDARSAHUB_SQL_HOST'],port=int(os.environ['EDARSAHUB_SQL_PORT']),database=os.environ['EDARSAHUB_SQL_DATABASE'],user=os.environ['EDARSAHUB_SQL_USER'],password=os.environ['EDARSAHUB_SQL_PASSWORD'],timeout=60,login_timeout=15)
          cur=conn.cursor(as_dict=True)
          cur.execute("SELECT DB_NAME() database_name,SUSER_SNAME() login_name,COALESCE(HAS_PERMS_BY_NAME(DB_NAME(),'DATABASE','CREATE TABLE'),0) can_create,COALESCE(HAS_PERMS_BY_NAME('dbo','SCHEMA','ALTER'),0) can_alter_schema")
          row=cur.fetchone(); print(row)
          cur.close(); conn.close()
          if row['database_name']!='EDARSAHUB' or row['login_name']!='HRLectura': raise SystemExit('COA_DDL_IDENTITY_MISMATCH')
          if int(row['can_create'])!=1 or int(row['can_alter_schema'])!=1: raise SystemExit('COA_DDL_PERMISSION_NOT_CONFIRMED')
          PY

      - name: Execute transactional migration
        env:
          EDARSAHUB_ALLOW_MIGRATIONS: 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/backend" python backend/tools/edarsahub_sql_runner.py --mode migrate --script "${MIGRATION_SCRIPT}" 2>&1 | tee evidence/migration.txt

      - name: Postcheck exact schema
        id: postcheck
        continue-on-error: true
        env:
          EDARSAHUB_SQL_USER: HRLectura
          EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/postcheck.txt
          import os,pymssql
          conn=pymssql.connect(server=os.environ['EDARSAHUB_SQL_HOST'],port=int(os.environ['EDARSAHUB_SQL_PORT']),database=os.environ['EDARSAHUB_SQL_DATABASE'],user=os.environ['EDARSAHUB_SQL_USER'],password=os.environ['EDARSAHUB_SQL_PASSWORD'],timeout=60,login_timeout=15)
          cur=conn.cursor(as_dict=True)
          cur.execute("SELECT COUNT(*) n FROM sys.tables WHERE name LIKE 'COA[_]%'"); tables=int(cur.fetchone()['n'])
          cur.execute("SELECT COUNT(*) n FROM sys.key_constraints kc JOIN sys.tables t ON t.object_id=kc.parent_object_id WHERE kc.type='PK' AND t.name LIKE 'COA[_]%'"); pks=int(cur.fetchone()['n'])
          cur.execute("SELECT COUNT(*) n FROM sys.indexes i JOIN sys.tables t ON t.object_id=i.object_id WHERE i.name LIKE 'IX_COA[_]%'"); indexes=int(cur.fetchone()['n'])
          cur.execute("SELECT COUNT(*) n FROM sys.foreign_keys fk JOIN sys.tables t ON t.object_id=fk.parent_object_id WHERE t.name LIKE 'COA[_]%'"); fks=int(cur.fetchone()['n'])
          cur.execute("SELECT SUM(p.rows) n FROM sys.tables t JOIN sys.partitions p ON p.object_id=t.object_id AND p.index_id IN (0,1) WHERE t.name LIKE 'COA[_]%'"); rows=int(cur.fetchone()['n'] or 0)
          print({'tables':tables,'pks':pks,'indexes':indexes,'fks':fks,'rows':rows})
          cur.close(); conn.close()
          if tables!=7 or pks!=7 or indexes!=12 or fks!=38 or rows!=0: raise SystemExit('COA_POSTCHECK_CONTRACT_MISMATCH')
          print('COA_POSTCHECK=PASS')
          PY

      - name: Rollback automatically if postcheck failed
        if: steps.postcheck.outcome == 'failure'
        env:
          EDARSAHUB_ALLOW_MIGRATIONS: 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/backend" python backend/tools/edarsahub_sql_runner.py --mode migrate --script "${ROLLBACK_SCRIPT}" 2>&1 | tee evidence/rollback.txt

      - name: Fail gate after rollback
        if: steps.postcheck.outcome == 'failure'
        run: exit 1

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coa-core-development-migration-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
