name: Preview Managed Drift Contract

on:
  push:
    branches:
      - fix/preview-managed-system-deps-drift-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/req-preview-drift.txt
          python -m pip install -r /tmp/req-preview-drift.txt

      - name: Run managed drift regression
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_preview_platform_managed_system_deps_drift.py \
            tests/test_git_divergence_guard_r1.py \
            tests/test_bootstrap_watchdog_safety_contract.py \
            tests/test_worker_runtime_startup_selfheal_r1.py
