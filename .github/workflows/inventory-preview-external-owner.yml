name: Inventory Preview External Owner

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/inventory-preview-external-owner.yml"
      - "backend/modules/scheduler_trigger_inventarios_preview/**"
      - "backend/server.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: inventory-preview-external-owner
  cancel-in-progress: false

env:
  OIDC_AUDIENCE: edarsahub-preview-inventory-scheduler
  RUNTIME_PROFILE: ops/runtime/profiles/development.json

jobs:
  inventory-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Resolve canonical Preview URL
        id: runtime
        run: |
          set -euo pipefail
          BASE_URL="$(python - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("ops/runtime/profiles/development.json").read_text())
          print(str(profile["base_url"]).rstrip("/"))
          PY
          )"
          test -n "$BASE_URL"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub OIDC token
        id: oidc
        env:
          AUDIENCE: ${{ env.OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body             --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check Preview inventory trigger
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          URL="${BASE_URL%/}/api/internal/preview-inventory-scheduler-trigger/health"
          HTTP_CODE="$(curl --silent --show-error             --output /tmp/inventory-health.json             --write-out '%{http_code}'             --connect-timeout 30             --max-time 120             --header "Authorization: Bearer $OIDC_TOKEN"             "$URL")"
          cat /tmp/inventory-health.json
          echo
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

      - name: Run canonical Preview SoftRestaurant inventory sync
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          URL="${BASE_URL%/}/api/internal/preview-inventory-scheduler-trigger/sync-compras"
          HTTP_CODE="$(curl --silent --show-error             --output /tmp/inventory-sync.json             --write-out '%{http_code}'             --connect-timeout 30             --max-time 2100             --request POST             --header "Authorization: Bearer $OIDC_TOKEN"             "$URL")"
          cat /tmp/inventory-sync.json
          echo
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

          python - /tmp/inventory-sync.json <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          status = str(payload.get("status") or "").upper()

          if payload.get("job_id") != "sync_compras":
              raise SystemExit(f"WRONG_JOB_ID={payload.get('job_id')}")

          if payload.get("production_touched") is not False:
              raise SystemExit("PRODUCTION_TOUCH_GUARD_FAILED")

          if status in {"SUCCESS", "PARTIAL"}:
              print(
                  "PREVIEW_INVENTORY_SYNC="
                  f"{status} processed={payload.get('total_processed')} "
                  f"errors={payload.get('total_errors')}"
              )
          elif status == "SKIPPED" and "lock" in str(
              payload.get("reason") or ""
          ).lower():
              print("PREVIEW_INVENTORY_SYNC=SKIPPED_ACTIVE_LOCK")
          else:
              raise SystemExit(
                  f"PREVIEW_INVENTORY_SYNC_UNHEALTHY status={status} payload={payload}"
              )
          PY
