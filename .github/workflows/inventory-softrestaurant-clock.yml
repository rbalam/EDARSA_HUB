name: Inventory SoftRestaurant Clock

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/inventory-softrestaurant-clock.yml"
      - "backend/tools/run_inventory_github_owner.py"

permissions:
  contents: read

concurrency:
  group: inventory-softrestaurant-clock
  cancel-in-progress: false

env:
  EDARSA_ENV: DEVELOPMENT
  SCHEDULER_SYNC_COMPRAS_ENABLED: "true"
  SCHEDULER_SYNC_COMPRAS_EXECUTION_ENABLED: "true"
  SCHEDULER_SYNC_COMPRAS_EXTENDED_ENABLED: "false"
  SYNC_COMPRAS_SYSTEM_FILTER: "SOFT"
  SYNC_COMPRAS_SCOPE: "INVENTORY_MOVEMENTS"
  SYNC_COMPRAS_MOV_DIAS_ATRAS: "30"
  SYNC_INVENTARIOS_FISICOS_QUERY_TIMEOUT_SECONDS: "180"
  EDARSAHUB_SQL_HOST: "54.39.104.176"
  EDARSAHUB_SQL_PORT: "1433"
  EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
  EDARSAHUB_SQL_USER: "HRLectura"
  EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}
  SERVER_SECRET_KEY: ${{ secrets.SERVER_SECRET_KEY }}

jobs:
  inventory-softrestaurant:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Validate base inventory owner secrets
        run: |
          set -euo pipefail
          test -n "$EDARSAHUB_SQL_PASSWORD"
          test -n "$SERVER_SECRET_KEY"
          echo "BASE_OWNER_SECRETS=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install SQL preflight runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pymssql

      - name: Verify effective DML permissions for atomic inventory scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pymssql

          required = {
              "dbo.Sync_Control_Ejecuciones": ("SELECT", "INSERT", "UPDATE"),
              "dbo.Inventario_Almacenes": ("SELECT", "INSERT", "UPDATE"),
              "dbo.Inventario_Movimientos": ("SELECT", "INSERT"),
              "dbo.Inventario_MovimientosDetalle": ("SELECT", "INSERT"),
              "dbo.Compras_Sync_Log": ("SELECT", "INSERT"),
          }

          conn = pymssql.connect(
              server=os.environ["EDARSAHUB_SQL_HOST"],
              port=int(os.environ["EDARSAHUB_SQL_PORT"]),
              database=os.environ["EDARSAHUB_SQL_DATABASE"],
              user=os.environ["EDARSAHUB_SQL_USER"],
              password=os.environ["EDARSAHUB_SQL_PASSWORD"],
              login_timeout=15,
              timeout=30,
              as_dict=True,
          )
          cur = conn.cursor(as_dict=True)
          cur.execute("SELECT DB_NAME() AS database_name, SUSER_SNAME() AS login_name")
          identity = cur.fetchone()
          print({
              "database_name": identity.get("database_name"),
              "login_name": identity.get("login_name"),
          })

          failures = []
          for obj, permissions in required.items():
              for permission in permissions:
                  cur.execute(
                      "SELECT COALESCE(HAS_PERMS_BY_NAME(%s,'OBJECT',%s),0) AS allowed",
                      (obj, permission),
                  )
                  allowed = int(cur.fetchone()["allowed"] or 0)
                  print(f"PERMISSION {obj} {permission}={allowed}")
                  if allowed != 1:
                      failures.append(f"{obj}:{permission}")

          cur.close()
          conn.close()

          if failures:
              raise SystemExit(
                  "INVENTORY_OWNER_DML_PERMISSION_MISSING=" + ",".join(failures)
              )

          print("INVENTORY_OWNER_DML_PREFLIGHT=PASS")
          PY

          echo "EDARSAHUB_SQL_WRITER_USER=$EDARSAHUB_SQL_USER" >> "$GITHUB_ENV"
          echo "EDARSAHUB_SQL_WRITER_PASSWORD=$EDARSAHUB_SQL_PASSWORD" >> "$GITHUB_ENV"

      - name: Install backend runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-inventory-owner.txt
          python -m pip install -r /tmp/requirements-inventory-owner.txt

      - name: Run canonical SoftRestaurant inventory sync
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python tools/run_inventory_github_owner.py

      - name: Verify CIENFUEGOS BARRA movements October 1-19
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pymssql

          conn = pymssql.connect(
              server=os.environ["EDARSAHUB_SQL_HOST"],
              port=int(os.environ["EDARSAHUB_SQL_PORT"]),
              database=os.environ["EDARSAHUB_SQL_DATABASE"],
              user=os.environ["EDARSAHUB_SQL_USER"],
              password=os.environ["EDARSAHUB_SQL_PASSWORD"],
              login_timeout=15,
              timeout=60,
              as_dict=True,
          )
          cur = conn.cursor(as_dict=True)

          # Resolver CIENFUEGOS y BARRA desde catálogos canónicos, sin IDs hardcodeados.
          cur.execute("""
              SELECT TOP 1
                  e.EmpresaID,
                  s.SucursalID,
                  a.AlmacenID,
                  a.CodigoAlmacen,
                  a.NombreAlmacen
              FROM dbo.Sistema_Empresas e
              INNER JOIN dbo.Sistema_Sucursales s
                  ON s.EmpresaID = e.EmpresaID
                 AND ISNULL(s.Activo,1)=1
              INNER JOIN dbo.Inventario_Almacenes a
                  ON a.EmpresaID = e.EmpresaID
                 AND a.SucursalID = s.SucursalID
                 AND ISNULL(a.Activo,1)=1
              WHERE UPPER(e.CodigoEmpresa) = 'CIENFUEGOS'
                AND (
                    UPPER(LTRIM(RTRIM(a.CodigoAlmacen))) IN ('200','200-BARRA')
                    OR UPPER(LTRIM(RTRIM(a.NombreAlmacen))) IN ('BARRA','200-BARRA')
                    OR UPPER(LTRIM(RTRIM(a.NombreAlmacen))) LIKE '%BARRA%'
                )
              ORDER BY
                  CASE
                      WHEN UPPER(LTRIM(RTRIM(a.CodigoAlmacen)))='200' THEN 0
                      WHEN UPPER(LTRIM(RTRIM(a.CodigoAlmacen)))='200-BARRA' THEN 1
                      ELSE 2
                  END,
                  a.AlmacenID
          """)
          scope = cur.fetchone()
          if not scope:
              raise SystemExit("CIENFUEGOS_BARRA_SCOPE_NOT_RESOLVED")

          cur.execute("""
              SELECT
                  COUNT(DISTINCT m.MovimientoID) AS movimientos,
                  COUNT(*) AS detalles,
                  MIN(m.FechaMovimiento) AS fecha_min,
                  MAX(m.FechaMovimiento) AS fecha_max,
                  SUM(
                      CASE
                          WHEN UPPER(LTRIM(RTRIM(ISNULL(tm.Naturaleza,''))))
                               IN ('E','EN','ENTRADA')
                          THEN ISNULL(d.Cantidad,0)
                          ELSE -ISNULL(d.Cantidad,0)
                      END
                  ) AS cantidad_neta
              FROM dbo.Inventario_Movimientos m
              INNER JOIN dbo.Inventario_MovimientosDetalle d
                  ON d.MovimientoID = m.MovimientoID
              INNER JOIN dbo.Inventario_TipoMovimiento tm
                  ON tm.TipoMovimientoID = m.TipoMovimientoID
              WHERE m.EmpresaID = %s
                AND m.SucursalID = %s
                AND m.AlmacenID = %s
                AND m.FechaMovimiento >= '2026-10-01'
                AND m.FechaMovimiento < '2026-10-20'
                AND ISNULL(m.Activo,1)=1
          """, (
              scope["EmpresaID"],
              scope["SucursalID"],
              scope["AlmacenID"],
          ))
          result = cur.fetchone() or {}

          payload = {
              "unidad": "CIENFUEGOS",
              "almacen_id": scope["AlmacenID"],
              "codigo_almacen": scope["CodigoAlmacen"],
              "nombre_almacen": scope["NombreAlmacen"],
              "periodo": "2026-10-01..2026-10-19",
              "movimientos": int(result.get("movimientos") or 0),
              "detalles": int(result.get("detalles") or 0),
              "fecha_min": str(result.get("fecha_min") or ""),
              "fecha_max": str(result.get("fecha_max") or ""),
              "cantidad_neta": float(result.get("cantidad_neta") or 0),
          }
          print("CIENFUEGOS_BARRA_MOVEMENTS=" + json.dumps(payload, ensure_ascii=False))

          cur.close()
          conn.close()

          if payload["movimientos"] <= 0 or payload["detalles"] <= 0:
              raise SystemExit("CIENFUEGOS_BARRA_MOVEMENTS_MISSING")
          PY
