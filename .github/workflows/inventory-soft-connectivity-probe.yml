name: Inventory Soft Connectivity Probe

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/inventory-soft-connectivity-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDARSAHUB_SQL_HOST: "54.39.104.176"
      EDARSAHUB_SQL_PORT: "1433"
      EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
      EDARSAHUB_SQL_USER: "HRLectura"
      EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQL probe runtime
        run: python -m pip install --quiet pymssql

      - name: Probe canonical SoftRestaurant endpoints
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import socket
          import pymssql

          conn = pymssql.connect(
              server=os.environ["EDARSAHUB_SQL_HOST"],
              port=int(os.environ["EDARSAHUB_SQL_PORT"]),
              database=os.environ["EDARSAHUB_SQL_DATABASE"],
              user=os.environ["EDARSAHUB_SQL_USER"],
              password=os.environ["EDARSAHUB_SQL_PASSWORD"],
              login_timeout=15,
              timeout=30,
              as_dict=True,
          )
          cur = conn.cursor(as_dict=True)
          cur.execute("""
              SELECT
                  s.nombre,
                  s.host,
                  ISNULL(s.port,1433) AS port,
                  s.system_type,
                  u.codigo AS unidad_codigo
              FROM dbo.Servidores_Conexiones s
              INNER JOIN dbo.Unidades_Negocio u
                  ON u.server_id = CAST(s.id AS nvarchar(36))
                 AND ISNULL(u.activo,0)=1
              WHERE ISNULL(s.activo,0)=1
                AND UPPER(LTRIM(RTRIM(s.system_type))) IN (
                    'SOFTRESTAURANT',
                    'SOFTRESTAURANT_PRO',
                    'SOFTRESTAURANTPRO',
                    'SR'
                )
              ORDER BY u.codigo
          """)
          rows = cur.fetchall() or []
          cur.close()
          conn.close()

          if not rows:
              raise SystemExit("NO_SOFTRESTAURANT_SERVERS")

          failed = []
          for row in rows:
              unit = str(row.get("unidad_codigo") or "")
              raw_host = str(row.get("host") or "").strip()
              port = int(row.get("port") or 1433)
              host = raw_host
              if "\\" in host:
                  host = host.split("\\", 1)[0].strip()
              if "," in host:
                  host_part, port_part = host.rsplit(",", 1)
                  host = host_part.strip()
                  try:
                      port = int(port_part.strip())
                  except ValueError:
                      pass
              try:
                  with socket.create_connection((host, port), timeout=7):
                      print(f"SOFT_TCP unit={unit} host={host} port={port} status=REACHABLE")
              except Exception as exc:
                  print(
                      f"SOFT_TCP unit={unit} host={host} port={port} "
                      f"status=UNREACHABLE error={type(exc).__name__}"
                  )
                  failed.append(unit)

          if failed:
              raise SystemExit("SOFT_TCP_UNREACHABLE=" + ",".join(failed))
          print("SOFT_TCP_PROBE=PASS")
          PY
