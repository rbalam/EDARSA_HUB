name: Commercial Secret Shape Diagnostic

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - ".github/workflows/commercial-secret-shape-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EDARSAHUB_SQL_HOST: "54.39.104.176"
      EDARSAHUB_SQL_PORT: "1433"
      EDARSAHUB_SQL_DATABASE: "EDARSAHUB"
      EDARSAHUB_SQL_USER: "HRLectura"
      EDARSAHUB_SQL_PASSWORD: ${{ secrets.EDARSAHUB_SQL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SQL client
        run: python -m pip install pymssql==2.3.13

      - name: Inspect credential encryption shape
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EDARSAHUB_SQL_PASSWORD"
          python - <<'PY'
          import json
          import os
          import pymssql

          conn = pymssql.connect(
              server=os.environ["EDARSAHUB_SQL_HOST"],
              port=int(os.environ["EDARSAHUB_SQL_PORT"]),
              user=os.environ["EDARSAHUB_SQL_USER"],
              password=os.environ["EDARSAHUB_SQL_PASSWORD"],
              database=os.environ["EDARSAHUB_SQL_DATABASE"],
              login_timeout=10,
              timeout=30,
              tds_version="7.0",
              as_dict=True,
          )
          cur = conn.cursor(as_dict=True)
          cur.execute("""
              SELECT
                  COUNT(*) AS activos,
                  SUM(CASE
                      WHEN password_encrypted LIKE 'enc:v1:%' THEN 1 ELSE 0
                  END) AS password_cifrados,
                  SUM(CASE
                      WHEN password_encrypted IS NOT NULL
                       AND LTRIM(RTRIM(password_encrypted)) <> ''
                       AND password_encrypted NOT LIKE 'enc:v1:%'
                      THEN 1 ELSE 0
                  END) AS password_legacy,
                  SUM(CASE
                      WHEN api_key_encrypted LIKE 'enc:v1:%' THEN 1 ELSE 0
                  END) AS api_key_cifradas,
                  SUM(CASE
                      WHEN api_key_encrypted IS NOT NULL
                       AND LTRIM(RTRIM(api_key_encrypted)) <> ''
                       AND api_key_encrypted NOT LIKE 'enc:v1:%'
                      THEN 1 ELSE 0
                  END) AS api_key_legacy
              FROM dbo.Servidores_Conexiones
              WHERE activo = 1
          """)
          row = cur.fetchone() or {}
          print(json.dumps({
              "active_connections": int(row.get("activos") or 0),
              "password_encrypted_count": int(row.get("password_cifrados") or 0),
              "password_legacy_count": int(row.get("password_legacy") or 0),
              "api_key_encrypted_count": int(row.get("api_key_cifradas") or 0),
              "api_key_legacy_count": int(row.get("api_key_legacy") or 0),
              "secrets_exposed": False,
              "production_touched": False,
          }, sort_keys=True))
          conn.close()
          PY
