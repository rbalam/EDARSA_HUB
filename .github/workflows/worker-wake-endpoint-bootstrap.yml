name: Worker Wake Endpoint Bootstrap
# Retrigger 2026-09-19T09:25Z: restore missing public wake endpoint for existing Cavas Gate16A pickup; no new job.
# Retrigger 2026-09-19T02:57-06:00: resilient marker for missing wake router mount recovery.
# Retrigger 2026-09-18T21:16-06:00: restore missing wake router mount for existing Cavas certification pickup.
# Manual retrigger 2026-09-18T20:05-06:00: restore missing /api/internal/worker/wake mount after R24E-R8 worktree cleanup.
# Manual retrigger for R24F DESIGN-CONTRACT wake endpoint recovery.

on:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - '.github/workflows/worker-wake-endpoint-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edarsahub-worker-wake-endpoint-bootstrap
  cancel-in-progress: false

jobs:
  install-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mount guarded Universal Worker wake router
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/server.py")
          text = path.read_text(encoding="utf-8")
          include_line = 'app.include_router(worker_runtime_wake_router, prefix="/api")'
          legacy_marker = '# Startup: Iniciar scheduler'
          fallback_marker = 'api_router = APIRouter(prefix="/api")'

          if include_line in text:
              print("WORKER_WAKE_ROUTER_ALREADY_MOUNTED=1")
              raise SystemExit(0)

          block = "\n".join([
              "# =============================================================================",
              "# UNIVERSAL WORKER - CONTROL DE RECUPERACION INTERNO",
              "# =============================================================================",
              "try:",
              "    from modules.worker_runtime_wake.routes import router as worker_runtime_wake_router",
              "    app.include_router(worker_runtime_wake_router, prefix=\"/api\")",
              "    logger.info(\"Universal Worker wake router registrado\")",
              "except Exception as e:",
              "    logger.warning(f\"Error registrando Universal Worker wake router: {e}\")",
              "",
              "",
          ])

          if legacy_marker in text:
              text = text.replace(legacy_marker, block + legacy_marker, 1)
          elif fallback_marker in text:
              text = text.replace(fallback_marker, fallback_marker + "\n\n" + block, 1)
          else:
              raise SystemExit("WORKER_WAKE_MOUNT_MARKER_NOT_FOUND")

          path.write_text(text, encoding="utf-8")
          print("WORKER_WAKE_ROUTER_MOUNTED=1")
          PY

      - name: Validate endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/server.py backend/modules/worker_runtime_wake/routes.py
          grep -F 'from modules.worker_runtime_wake.routes import router as worker_runtime_wake_router' backend/server.py
          grep -F 'app.include_router(worker_runtime_wake_router, prefix="/api")' backend/server.py
          grep -F 'WORKER_SERVICE = "edarsahub-universal-worker"' backend/modules/worker_runtime_wake/routes.py
          grep -F '["supervisorctl", "restart", WORKER_SERVICE]' backend/modules/worker_runtime_wake/routes.py
          git diff --check

      - name: Commit endpoint mount
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/server.py; then
            echo "NO_SERVER_CHANGE_REQUIRED=1"
            exit 0
          fi
          git config user.name "EDARSAHUB Bootstrap"
          git config user.email "bootstrap@edarsahub.local"
          git add -- backend/server.py
          git commit -m "fix(worker): mount guarded Universal Worker wake endpoint"
          git fetch origin Edarsahub_Desarrollo
          git rebase origin/Edarsahub_Desarrollo
          git push origin HEAD:Edarsahub_Desarrollo
