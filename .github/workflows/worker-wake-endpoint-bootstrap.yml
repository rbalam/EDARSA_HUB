name: Worker Wake Endpoint Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - '.github/workflows/worker-wake-endpoint-bootstrap.yml'
      - 'backend/modules/worker_runtime_wake/routes.py'
      - 'backend/server.py'
      - 'tools/bootstrap/recover_preview_runtime.sh'

permissions:
  contents: read

concurrency:
  group: edarsahub-worker-wake-endpoint-bootstrap
  cancel-in-progress: false

jobs:
  verify-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/server.py backend/modules/worker_runtime_wake/routes.py
          grep -F 'ensure_worker_runtime_on_preview_startup' backend/server.py
          grep -F 'def ensure_worker_runtime_on_preview_startup()' backend/modules/worker_runtime_wake/routes.py
          grep -F 'WORKER_SERVICE = "edarsahub-universal-worker"' backend/modules/worker_runtime_wake/routes.py
          grep -F 'PRODUCTION_TOUCHED=NO' tools/bootstrap/recover_preview_runtime.sh
          test "$(grep -F 'app.include_router(worker_runtime_wake_router, prefix="/api")' backend/server.py | wc -l)" -eq 1
          git diff --check

      - name: Probe public wake endpoint once
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_URL='https://erp-crm-enterprise-1.preview.emergentagent.com'
          QUEUE_SHA="$(git ls-remote origin refs/heads/worker/requests | awk '{print $1}')"
          HTTP_CODE="$(curl --silent --show-error --location \
            --connect-timeout 4 --max-time 12 \
            --output /tmp/wake-probe.json --write-out '%{http_code}' \
            --request POST "$RUNTIME_URL/api/internal/worker/wake" \
            --header "X-Worker-Queue-Sha: $QUEUE_SHA" \
            --header 'Content-Type: application/json' \
            --data '{}' || true)"
          echo "PUBLIC_WAKE_HTTP_CODE=$HTTP_CODE"
          cat /tmp/wake-probe.json 2>/dev/null || true
          echo
          case "$HTTP_CODE" in
            200|202|429)
              echo "PUBLIC_WAKE_ENDPOINT=READY"
              ;;
            409)
              if grep -qi 'worker wake already in progress' /tmp/wake-probe.json 2>/dev/null; then
                echo "PUBLIC_WAKE_ENDPOINT=READY"
              else
                echo "PUBLIC_WAKE_ENDPOINT=REACHABLE_CONFLICT"
              fi
              ;;
            404)
              echo "PREVIEW_RUNTIME_RESTART_REQUIRED=1"
              exit 12
              ;;
            *)
              echo "PUBLIC_WAKE_ENDPOINT=UNAVAILABLE"
              exit 13
              ;;
          esac

      - name: Confirm production untouched
        if: always()
        shell: bash
        run: |
          echo 'PRODUCTION_TOUCHED=NO'
