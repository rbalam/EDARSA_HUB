name: Inventory Writer Profile PR84 Temp Gate

on:
  pull_request:
    branches:
      - Edarsahub_Desarrollo
    paths:
      - "backend/modules/compras/sync_service.py"
      - "backend/core/inventarios/sync_movimientos_canonico.py"
      - "backend/core/scheduler/jobs/sync_compras_job.py"
      - "backend/tests/test_sync_inventarios_fisicos.py"
      - "backend/tests/test_sync_compras_run_job_now_status.py"
      - ".github/workflows/inventory-writer-profile-pr84-temp.yml"

permissions:
  contents: read

jobs:
  inventory-writer-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^emergentintegrations==' backend/requirements.txt > /tmp/requirements-inventory-writer.txt
          python -m pip install -r /tmp/requirements-inventory-writer.txt

      - name: Compile changed inventory modules
        run: |
          python -m py_compile \
            backend/modules/compras/sync_service.py \
            backend/core/inventarios/sync_movimientos_canonico.py \
            backend/core/scheduler/jobs/sync_compras_job.py \
            backend/tests/test_sync_inventarios_fisicos.py \
            backend/tests/test_sync_compras_run_job_now_status.py

      - name: Run focused inventory tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pytest -q --tb=short \
            tests/test_sync_inventarios_fisicos.py \
            tests/test_sync_compras_run_job_now_status.py

      - name: Verify commercial files untouched
        run: |
          set -euo pipefail
          git diff --name-only origin/Edarsahub_Desarrollo...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          ! grep -Eq '^backend/core/scheduler/jobs/sync_comercial_(abiertas_)?v2_job\.py$' /tmp/changed.txt
          ! grep -Eq '^backend/modules/comercial_v2/' /tmp/changed.txt