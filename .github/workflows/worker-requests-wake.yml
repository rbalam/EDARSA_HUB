name: Worker Requests Wake

on:
  push:
    branches:
      - worker/requests

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve published job and wake Universal Worker
        shell: bash
        run: |
          set -euo pipefail

          QUEUE_SHA="${GITHUB_SHA}"
          test "${#QUEUE_SHA}" -eq 40

          JOB_PATH="$(git show --pretty='' --name-only "$GITHUB_SHA" | grep '^worker_queue/inbox/.*\.json
          if [ -n "$JOB_ID" ] && ! [[ "$JOB_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,120}$ ]]; then
            echo 'INVALID_PREFERRED_JOB_ID'
            exit 14
          fi

          RUNTIME_URL='https://erp-crm-enterprise-1.preview.emergentagent.com'
          FINAL_HTTP=000

          for attempt in 1 2 3 4 5 6; do
            echo "WAKE_ATTEMPT=$attempt"
            HTTP_CODE="$(curl --silent --show-error --location               --connect-timeout 5 --max-time 25               --output /tmp/wake.json --write-out '%{http_code}'               --request POST "$RUNTIME_URL/api/internal/worker/wake"               --header "X-Worker-Queue-Sha: $QUEUE_SHA"               --header "X-Worker-Preferred-Job-Id: $JOB_ID"               --header 'Content-Type: application/json'               --data '{}' || true)"
            FINAL_HTTP="$HTTP_CODE"
            cat /tmp/wake.json 2>/dev/null || true
            echo
            echo "WAKE_HTTP_CODE=$HTTP_CODE"
            echo "PREFERRED_JOB_ID=${JOB_ID:-none}"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done

          echo "WORKER_WAKE_FAILED_HTTP=$FINAL_HTTP"
          exit 12
 | tail -n 1 || true)"
          if [ -z "$JOB_PATH" ]; then
            JOB_PATH="$(git ls-tree -r --name-only "$GITHUB_SHA" worker_queue/inbox | grep '^worker_queue/inbox/.*\.json
          if [ -n "$JOB_ID" ] && ! [[ "$JOB_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,120}$ ]]; then
            echo 'INVALID_PREFERRED_JOB_ID'
            exit 14
          fi

          RUNTIME_URL='https://erp-crm-enterprise-1.preview.emergentagent.com'
          FINAL_HTTP=000

          for attempt in 1 2 3 4 5 6; do
            echo "WAKE_ATTEMPT=$attempt"
            HTTP_CODE="$(curl --silent --show-error --location               --connect-timeout 5 --max-time 25               --output /tmp/wake.json --write-out '%{http_code}'               --request POST "$RUNTIME_URL/api/internal/worker/wake"               --header "X-Worker-Queue-Sha: $QUEUE_SHA"               --header "X-Worker-Preferred-Job-Id: $JOB_ID"               --header 'Content-Type: application/json'               --data '{}' || true)"
            FINAL_HTTP="$HTTP_CODE"
            cat /tmp/wake.json 2>/dev/null || true
            echo
            echo "WAKE_HTTP_CODE=$HTTP_CODE"
            echo "PREFERRED_JOB_ID=${JOB_ID:-none}"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done

          echo "WORKER_WAKE_FAILED_HTTP=$FINAL_HTTP"
          exit 12
 | tail -n 1 || true)"
          fi
          JOB_ID=""
          if [ -n "$JOB_PATH" ]; then
            JOB_ID="$(basename "$JOB_PATH" .json)"
          fi

          if [ -n "$JOB_ID" ] && ! [[ "$JOB_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,120}$ ]]; then
            echo 'INVALID_PREFERRED_JOB_ID'
            exit 14
          fi

          RUNTIME_URL='https://erp-crm-enterprise-1.preview.emergentagent.com'
          FINAL_HTTP=000

          for attempt in 1 2 3 4 5 6; do
            echo "WAKE_ATTEMPT=$attempt"
            HTTP_CODE="$(curl --silent --show-error --location               --connect-timeout 5 --max-time 25               --output /tmp/wake.json --write-out '%{http_code}'               --request POST "$RUNTIME_URL/api/internal/worker/wake"               --header "X-Worker-Queue-Sha: $QUEUE_SHA"               --header "X-Worker-Preferred-Job-Id: $JOB_ID"               --header 'Content-Type: application/json'               --data '{}' || true)"
            FINAL_HTTP="$HTTP_CODE"
            cat /tmp/wake.json 2>/dev/null || true
            echo
            echo "WAKE_HTTP_CODE=$HTTP_CODE"
            echo "PREFERRED_JOB_ID=${JOB_ID:-none}"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done

          echo "WORKER_WAKE_FAILED_HTTP=$FINAL_HTTP"
          exit 12
